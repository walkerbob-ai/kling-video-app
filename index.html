<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مولّد الفيديو الإعلاني - Kling AI</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Tahoma, Arial, sans-serif; background: #0a0a0a; color: #fff; min-height: 100vh; padding: 20px; }
  .container { max-width: 480px; margin: 0 auto; }
  h1 { text-align: center; font-size: 22px; font-weight: 600; margin-bottom: 6px; background: linear-gradient(135deg, #00ff88, #00aaff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .subtitle { text-align: center; font-size: 13px; color: #666; margin-bottom: 24px; }
  .card { background: #111; border: 1px solid #222; border-radius: 16px; padding: 20px; margin-bottom: 16px; }
  .card-title { font-size: 13px; color: #888; margin-bottom: 12px; font-weight: 500; }
  .upload-area { border: 2px dashed #333; border-radius: 12px; padding: 32px 16px; text-align: center; cursor: pointer; transition: border-color 0.2s; position: relative; }
  .upload-area:hover { border-color: #00ff88; }
  .upload-area.has-image { border-style: solid; border-color: #00ff88; padding: 8px; }
  .upload-area input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .upload-icon { font-size: 32px; margin-bottom: 8px; }
  .upload-text { font-size: 14px; color: #555; }
  .preview-img { width: 100%; border-radius: 8px; display: none; max-height: 220px; object-fit: cover; }
  textarea { width: 100%; background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 10px; color: #fff; font-size: 14px; padding: 12px; resize: vertical; min-height: 80px; font-family: inherit; line-height: 1.6; direction: rtl; outline: none; transition: border-color 0.2s; }
  textarea:focus { border-color: #00ff88; }
  .api-input { width: 100%; background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 10px; color: #fff; font-size: 13px; padding: 10px 12px; font-family: monospace; outline: none; transition: border-color 0.2s; direction: ltr; }
  .api-input:focus { border-color: #00aaff; }
  .options-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
  select { width: 100%; background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 10px; color: #fff; font-size: 13px; padding: 10px 12px; outline: none; cursor: pointer; direction: rtl; }
  .label { font-size: 12px; color: #666; margin-bottom: 6px; }
  .btn-generate { width: 100%; padding: 16px; background: linear-gradient(135deg, #00ff88, #00aaff); border: none; border-radius: 12px; color: #000; font-size: 16px; font-weight: 700; cursor: pointer; transition: opacity 0.2s, transform 0.1s; margin-top: 8px; }
  .btn-generate:hover { opacity: 0.9; }
  .btn-generate:active { transform: scale(0.98); }
  .btn-generate:disabled { opacity: 0.4; cursor: not-allowed; }
  .status-box { display: none; background: #111; border: 1px solid #222; border-radius: 16px; padding: 20px; text-align: center; margin-bottom: 16px; }
  .spinner { width: 40px; height: 40px; border: 3px solid #222; border-top-color: #00ff88; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .status-text { font-size: 14px; color: #888; }
  .status-timer { font-size: 24px; font-weight: 700; color: #00ff88; margin-top: 8px; }
  .result-box { display: none; background: #111; border: 1px solid #1a3a1a; border-radius: 16px; padding: 20px; text-align: center; margin-bottom: 16px; }
  .result-box video { width: 100%; border-radius: 10px; margin-bottom: 12px; }
  .btn-download { display: inline-block; padding: 12px 28px; background: #00ff88; color: #000; border-radius: 10px; font-weight: 700; text-decoration: none; font-size: 14px; }
  .error-box { display: none; background: #1a0a0a; border: 1px solid #3a1a1a; border-radius: 12px; padding: 16px; margin-bottom: 16px; font-size: 13px; color: #ff6666; }
  .progress-bar { width: 100%; height: 4px; background: #222; border-radius: 2px; margin-top: 12px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, #00ff88, #00aaff); border-radius: 2px; width: 0%; transition: width 0.5s; }
</style>
</head>
<body>
<div class="container">
  <h1>🎬 مولّد الفيديو الإعلاني</h1>
  <p class="subtitle">حرّك صورتك وحوّلها لفيديو إعلاني احترافي</p>

  <div class="card">
    <div class="card-title">🔑 مفتاح Kling API</div>
    <input class="api-input" type="password" id="apiKey" placeholder="api-key-kling-i_..." />
    <div style="font-size:11px;color:#444;margin-top:6px;">يُحفظ في المتصفح فقط</div>
  </div>

  <div class="card">
    <div class="card-title">🖼️ الصورة</div>
    <div class="upload-area" id="uploadArea">
      <input type="file" id="imageInput" accept="image/*" onchange="handleImage(event)" />
      <div id="uploadPlaceholder">
        <div class="upload-icon">📸</div>
        <div class="upload-text">اضغط لرفع صورة المنتج</div>
        <div style="font-size:11px;color:#444;margin-top:4px;">JPG, PNG, WEBP</div>
      </div>
      <img id="previewImg" class="preview-img" />
    </div>
  </div>

  <div class="card">
    <div class="card-title">✍️ برومت التحريك</div>
    <textarea id="prompt" placeholder="مثال: زجاجة عطر تدور ببطء مع تأثير ضوء ذهبي فاخر..." rows="3"></textarea>
  </div>

  <div class="card">
    <div class="card-title">⚙️ إعدادات الفيديو</div>
    <div class="options-row">
      <div>
        <div class="label">المدة</div>
        <select id="duration">
          <option value="5">5 ثواني</option>
          <option value="8" selected>8 ثواني</option>
          <option value="10">10 ثواني</option>
        </select>
      </div>
      <div>
        <div class="label">الجودة</div>
        <select id="mode">
          <option value="std">عادي (أسرع)</option>
          <option value="pro" selected>احترافي</option>
        </select>
      </div>
    </div>
    <div style="margin-top:10px;">
      <div class="label">النسبة</div>
      <select id="ratio">
        <option value="9:16" selected>9:16 — ريلز وشورتس</option>
        <option value="16:9">16:9 — أفقي</option>
        <option value="1:1">1:1 — مربع</option>
      </select>
    </div>
  </div>

  <button class="btn-generate" id="generateBtn" onclick="generate()">✨ توليد الفيديو</button>

  <div class="status-box" id="statusBox">
    <div class="spinner"></div>
    <div class="status-text" id="statusText">جاري إرسال الطلب...</div>
    <div class="status-timer" id="statusTimer"></div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  </div>

  <div class="error-box" id="errorBox"></div>

  <div class="result-box" id="resultBox">
    <video id="resultVideo" controls loop autoplay muted playsinline></video>
    <div style="margin-bottom:12px;color:#888;font-size:13px;">✅ الفيديو جاهز!</div>
    <a class="btn-download" id="downloadBtn" target="_blank">⬇️ تحميل الفيديو</a>
  </div>
</div>

<script>
let imageBase64 = null;
let timerInterval = null;
let seconds = 0;

function handleImage(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const data = ev.target.result;
    imageBase64 = data.split(',')[1];
    const img = document.getElementById('previewImg');
    img.src = data;
    img.style.display = 'block';
    document.getElementById('uploadPlaceholder').style.display = 'none';
    document.getElementById('uploadArea').classList.add('has-image');
  };
  reader.readAsDataURL(file);
}

function showError(msg) {
  const box = document.getElementById('errorBox');
  box.textContent = '⚠️ ' + msg;
  box.style.display = 'block';
}

function hideError() { document.getElementById('errorBox').style.display = 'none'; }

function startTimer() {
  seconds = 0;
  timerInterval = setInterval(() => {
    seconds++;
    const m = Math.floor(seconds / 60);
    const s = seconds % 60;
    document.getElementById('statusTimer').textContent = (m > 0 ? m + 'د ' : '') + s + 'ث';
  }, 1000);
}

function stopTimer() { clearInterval(timerInterval); }

async function callProxy(url, method, headers, body) {
  const res = await fetch('/api/proxy', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ url, method, headers, body })
  });
  return res;
}

async function generate() {
  hideError();
  const apiKey = document.getElementById('apiKey').value.trim();
  const prompt = document.getElementById('prompt').value.trim();
  if (!apiKey) { showError('الرجاء إدخال مفتاح API'); return; }
  if (!imageBase64) { showError('الرجاء رفع صورة أولاً'); return; }
  if (!prompt) { showError('الرجاء كتابة برومت التحريك'); return; }

  const duration = parseInt(document.getElementById('duration').value);
  const mode = document.getElementById('mode').value;
  const ratio = document.getElementById('ratio').value;
  const model = mode === 'pro' ? 'kling-v1-6-pro' : 'kling-v1-6';

  document.getElementById('generateBtn').disabled = true;
  document.getElementById('resultBox').style.display = 'none';
  document.getElementById('statusBox').style.display = 'block';
  document.getElementById('statusText').textContent = 'جاري إرسال الطلب...';
  document.getElementById('progressFill').style.width = '10%';
  startTimer();

  try {
    const res = await callProxy(
      'https://api.klingai.com/v1/videos/image2video',
      'POST',
      { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + apiKey },
      { model, image: imageBase64, prompt, duration, aspect_ratio: ratio, cfg_scale: 0.5 }
    );

    const data = await res.json();
    if (!res.ok || data.code !== 0) throw new Error(data.message || 'فشل الطلب: ' + res.status);

    const taskId = data.data.task_id;
    document.getElementById('statusText').textContent = 'جاري التوليد... قد يستغرق 1-3 دقائق';
    document.getElementById('progressFill').style.width = '30%';

    await pollResult(taskId, apiKey);

  } catch (err) {
    stopTimer();
    document.getElementById('statusBox').style.display = 'none';
    document.getElementById('generateBtn').disabled = false;
    showError(err.message);
  }
}

async function pollResult(taskId, apiKey) {
  let attempts = 0;
  const poll = async () => {
    attempts++;
    try {
      const res = await callProxy(
        'https://api.klingai.com/v1/videos/image2video/' + taskId,
        'GET',
        { 'Authorization': 'Bearer ' + apiKey },
        null
      );
      const data = await res.json();
      const status = data.data?.task_status;
      document.getElementById('progressFill').style.width = Math.min(30 + attempts * 3, 90) + '%';

      if (status === 'succeed') {
        stopTimer();
        document.getElementById('progressFill').style.width = '100%';
        const videoUrl = data.data.task_result?.videos?.[0]?.url;
        if (!videoUrl) throw new Error('لم يتم إرجاع رابط الفيديو');
        setTimeout(() => showResult(videoUrl), 500);
      } else if (status === 'failed') {
        throw new Error('فشل التوليد: ' + (data.data?.task_status_msg || 'خطأ'));
      } else if (attempts < 120) {
        document.getElementById('statusText').textContent = 'جاري التوليد... (' + attempts + ')';
        setTimeout(poll, 5000);
      } else {
        throw new Error('انتهت المهلة — يرجى المحاولة مرة أخرى');
      }
    } catch (err) {
      stopTimer();
      document.getElementById('statusBox').style.display = 'none';
      document.getElementById('generateBtn').disabled = false;
      showError(err.message);
    }
  };
  setTimeout(poll, 8000);
}

function showResult(url) {
  document.getElementById('statusBox').style.display = 'none';
  document.getElementById('generateBtn').disabled = false;
  const video = document.getElementById('resultVideo');
  video.src = url;
  document.getElementById('downloadBtn').href = url;
  document.getElementById('resultBox').style.display = 'block';
  document.getElementById('resultBox').scrollIntoView({ behavior: 'smooth' });
}

window.onload = () => {
  const saved = localStorage.getItem('kling_api_key');
  if (saved) document.getElementById('apiKey').value = saved;
  document.getElementById('apiKey').addEventListener('change', (e) => {
    if (e.target.value) localStorage.setItem('kling_api_key', e.target.value);
  });
};
</script>
</body>
</html>
